<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>혼살지수</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="app/app/css/style.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="text-success fw-bold">🏠 혼살지수</h1>
    <p>강원도에서 혼자 살기 좋은 동네 찾기</p>

    <button class="btn btn-success" id="startBtn">
      시작하기
    </button>


<!-- 주소 및 장소 검색 -->
<form id="searchForm" class="mb-3">
  <div class="input-group">
    <input
      type="search"
      id="addressInput"
      class="form-control"
      placeholder="주소 또는 장소명 입력 (예: 춘천시 퇴계동)"
      aria-label="주소 또는 장소명"
      required
    >

    <button class="btn btn-success" type="submit">
      🔍 검색
    </button>
  </div>
</form>

<!-- 검색 결과 안내 -->
<p id="searchMessage" class="text-secondary"
   role="status" aria-live="polite"></p>

    <h2 class="mt-5">강원도 생활 편의 지도</h2>
    <p>지도에서 지역을 선택해 보세요.</p>

    <div id="map"></div>
    <p id="mapStatus" class="mt-2 text-secondary">
      지도를 불러오는 중입니다.
    </p>
  </main>

  <!-- 카카오맵 SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=47416903dbb8382e64e4d03f5f3e9218&libraries=services&autoload=false"></script>

  <script src="app/app/js/map.js"></script>
  <script src="app/app/js/main.js"></script>
</body>
</html>
